name: YOLOInspect Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4"
          pip install torch==2.0.1+cpu torchvision==0.15.2+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.0

      - name: Run YOLOInspect tests
        run: |
          chmod +x yoloinspect test_yoloinspect.bash
          ./test_yoloinspect.bash
